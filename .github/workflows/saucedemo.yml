name: Sauce Demo Test CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Added permissions for GitHub Pages to host the report
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest  # Ensure the allure plugin is installed

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps

      # Step 5: Run Tests with Allure
      - name: Run Sanity Tests
        if: always() # Run even if tests fail
        run: |
            pytest -v --browser chromium --alluredir=allure-results

      # Step 6: Load Allure history (Optional but recommended for trends)
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # Step 7: Generate and Publish Allure Report
      - name: Allure Report Action from Marketplace
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      # Step 8: Deploy Report to GitHub Pages
      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history